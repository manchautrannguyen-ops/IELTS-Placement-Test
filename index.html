<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Full Practice Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; font-family: 'Inter', Arial, sans-serif; background: #0d1117; }

        /* Registration Page */
        #reg-page { position: fixed; inset: 0; z-index: 999; background: linear-gradient(135deg, #0d1117 0%, #1a1a2e 50%, #16213e 100%); display: flex; align-items: center; justify-content: center; }
        #reg-page.hidden { display: none; }
        .reg-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(74,144,226,0.25); border-radius: 20px; padding: 52px 48px; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(74,144,226,0.1); backdrop-filter: blur(20px); text-align: center; }
        .reg-logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 32px; }
        .reg-logo-badge { background: #4a90e2; color: #fff; font-size: 13px; font-weight: 800; padding: 6px 14px; border-radius: 8px; letter-spacing: 2px; }
        .reg-logo-text { color: rgba(255,255,255,0.5); font-size: 13px; font-weight: 500; letter-spacing: 1px; }
        .reg-title { font-family: 'Merriweather', serif; font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 8px; line-height: 1.35; }
        .reg-subtitle { color: rgba(255,255,255,0.4); font-size: 14px; margin-bottom: 36px; }
        .reg-info { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 36px; }
        .reg-info-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 14px 6px; }
        .reg-info-card .val { font-size: 16px; font-weight: 700; color: #4a90e2; margin-bottom: 4px; }
        .reg-info-card .lbl { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.5px; }
        .reg-field-label { text-align: left; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
        .reg-input { width: 100%; padding: 14px 18px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; color: #fff; font-size: 16px; font-family: inherit; outline: none; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; margin-bottom: 8px; }
        .reg-input::placeholder { color: rgba(255,255,255,0.25); }
        .reg-input:focus { border-color: #4a90e2; background: rgba(74,144,226,0.06); box-shadow: 0 0 0 3px rgba(74,144,226,0.15); }
        .reg-input.error { border-color: #e74c3c; }
        .reg-error { color: #e74c3c; font-size: 13px; text-align: left; min-height: 20px; margin-bottom: 20px; display: none; }
        .reg-error.show { display: block; }
        .reg-btn { width: 100%; padding: 15px; background: #4a90e2; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; transition: background 0.2s, transform 0.15s, box-shadow 0.2s; box-shadow: 0 4px 16px rgba(74,144,226,0.3); margin-top: 4px; font-family: inherit; }
        .reg-btn:hover { background: #357abd; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(74,144,226,0.4); }
        .reg-btn:active { transform: translateY(0); }

        /* App Shell */
        #app-shell { display: none; flex-direction: column; height: 100vh; }
        #app-shell.visible { display: flex; }

        /* Top Bar */
        .top-bar { background: #13131f; border-bottom: 1px solid rgba(255,255,255,0.07); height: 54px; display: flex; align-items: center; flex-shrink: 0; padding: 0 16px; gap: 0; }
        .top-bar-brand { display: flex; align-items: center; gap: 8px; padding-right: 18px; border-right: 1px solid rgba(255,255,255,0.08); margin-right: 14px; flex-shrink: 0; }
        .brand-badge { background: #4a90e2; color: #fff; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 6px; letter-spacing: 1.5px; }
        .student-tag { font-size: 13px; color: rgba(255,255,255,0.45); padding-right: 18px; border-right: 1px solid rgba(255,255,255,0.08); margin-right: 4px; flex-shrink: 0; }
        .student-tag strong { color: rgba(255,255,255,0.85); font-weight: 600; }
        .tab-nav { display: flex; align-items: stretch; flex: 1; }
        .tab-btn { display: flex; align-items: center; gap: 8px; padding: 0 18px; background: none; border: none; border-bottom: 3px solid transparent; color: rgba(255,255,255,0.25); font-size: 12px; font-weight: 700; font-family: inherit; cursor: not-allowed; text-transform: uppercase; letter-spacing: 0.8px; transition: all 0.2s; white-space: nowrap; opacity: 0.4; height: 100%; }
        .tab-btn.unlocked { cursor: pointer; opacity: 1; color: rgba(255,255,255,0.5); }
        .tab-btn.unlocked:hover { color: #fff; background: rgba(255,255,255,0.04); }
        .tab-btn.active { color: #4a90e2; border-bottom-color: #4a90e2; background: rgba(74,144,226,0.06); opacity: 1; }
        .tab-num { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.35); font-size: 10px; font-weight: 700; flex-shrink: 0; }
        .tab-btn.unlocked .tab-num { background: rgba(74,144,226,0.2); color: #4a90e2; }
        .tab-btn.active .tab-num { background: #4a90e2; color: #fff; }
        .tab-done { display: none; font-size: 9px; color: #28a745; background: rgba(40,167,69,0.15); padding: 2px 7px; border-radius: 8px; font-weight: 700; letter-spacing: 0.3px; }
        .tab-btn.done .tab-done { display: inline; }
        .tab-spacer { flex: 1; }

        /* Frame Area */
        .frame-area { flex: 1; position: relative; overflow: hidden; }
        .test-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: none; background: #fff; }
        .test-frame.active { display: block; }

        /* Transition Overlay */
        .transition-overlay { position: fixed; inset: 0; z-index: 500; background: #0d1117; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
        .transition-overlay.show { display: flex; }
        .t-spinner { width: 44px; height: 44px; border: 4px solid rgba(74,144,226,0.15); border-top-color: #4a90e2; border-radius: 50%; animation: spin 0.7s linear infinite; }
        .t-label { color: rgba(255,255,255,0.55); font-size: 15px; font-weight: 500; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- Registration Page -->
<div id="reg-page">
    <div class="reg-card">
        <div class="reg-logo">
            <span class="reg-logo-badge">IELTS</span>
            <span class="reg-logo-text">FULL PRACTICE TEST</span>
        </div>
        <h1 class="reg-title">Welcome to Your<br>Practice Exam</h1>
        <p class="reg-subtitle">Complete all four sections in order</p>
        <div class="reg-info">
            <div class="reg-info-card"><div class="val">35'</div><div class="lbl">Listening</div></div>
            <div class="reg-info-card"><div class="val">60'</div><div class="lbl">Reading</div></div>
            <div class="reg-info-card"><div class="val">40'</div><div class="lbl">Writing</div></div>
            <div class="reg-info-card"><div class="val">15'</div><div class="lbl">Speaking</div></div>
        </div>
        <div class="reg-field-label">Full Name</div>
        <input type="text" id="reg-input" class="reg-input" placeholder="e.g. Nguyen Van A" autocomplete="name" maxlength="80" />
        <div class="reg-error" id="reg-error">Please enter your full name to continue.</div>
        <button class="reg-btn" id="reg-btn">Begin Test &rarr;</button>
    </div>
</div>

<!-- App Shell -->
<div id="app-shell">
    <div class="top-bar">
        <div class="top-bar-brand">
            <span class="brand-badge">IELTS</span>
        </div>
        <div class="student-tag">Student: <strong id="display-name"></strong></div>
        <nav class="tab-nav">
            <button class="tab-btn active unlocked" data-test="listening" onclick="switchTest('listening', this)">
                <span class="tab-num">1</span> Listening <span class="tab-done">✓ Done</span>
            </button>
            <button class="tab-btn" data-test="reading" onclick="switchTest('reading', this)">
                <span class="tab-num">2</span> Reading <span class="tab-done">✓ Done</span>
            </button>
            <button class="tab-btn" data-test="writing" onclick="switchTest('writing', this)">
                <span class="tab-num">3</span> Writing <span class="tab-done">✓ Done</span>
            </button>
            <button class="tab-btn" data-test="speaking" onclick="switchTest('speaking', this)">
                <span class="tab-num">4</span> Speaking <span class="tab-done">✓ Done</span>
            </button>
            <div class="tab-spacer"></div>
        </nav>
    </div>
    <div class="frame-area">
        <iframe class="test-frame active" id="frame-listening" srcdoc="<!DOCTYPE html>

<html lang=&quot;en&quot;>

<head>

<meta charset=&quot;UTF-8&quot;>

<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>

<title>IELTS Listening Test – April</title>

<link href=&quot;https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap&quot; rel=&quot;stylesheet&quot;>

<style>

  :root {

    --ink: #1a1a2e;

    --paper: #faf8f2;

    --cream: #f4f0e6;

    --accent: #c0392b;

    --accent2: #2980b9;

    --gold: #d4a017;

    --muted: #7a7065;

    --border: #d8d0be;

    --correct: #1a6b3c;

    --incorrect: #a31515;

    --correct-bg: #e8f5ee;

    --incorrect-bg: #fdecea;

    --highlight-yellow: rgba(255, 230, 50, 0.45);

    --highlight-blue: rgba(100, 180, 255, 0.4);

    --highlight-green: rgba(80, 200, 120, 0.4);

    --highlight-pink: rgba(255, 120, 160, 0.4);

  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {

    font-family: 'Source Serif 4', Georgia, serif;

    background: var(--paper);

    color: var(--ink);

    min-height: 100vh;

  }

  /* ── SPLASH ── */

  #splash {

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: var(--ink);

    color: var(--paper);

    text-align: center;

    padding: 2rem;

  }

  #splash h1 {

    font-family: 'Playfair Display', serif;

    font-size: clamp(2.2rem, 6vw, 4rem);

    letter-spacing: 0.04em;

    margin-bottom: .5rem;

  }

  #splash .subtitle {

    font-size: 1.1rem;

    color: var(--gold);

    letter-spacing: .15em;

    text-transform: uppercase;

    margin-bottom: 2.5rem;

  }

  #splash .info-grid {

    display: flex;

    gap: 2rem;

    flex-wrap: wrap;

    justify-content: center;

    margin-bottom: 2.5rem;

  }

  #splash .info-card {

    background: rgba(255,255,255,.06);

    border: 1px solid rgba(255,255,255,.15);

    border-radius: 8px;

    padding: 1rem 1.5rem;

    min-width: 140px;

  }

  #splash .info-card .val {

    font-family: 'JetBrains Mono', monospace;

    font-size: 1.5rem;

    font-weight: 600;

    color: var(--gold);

  }

  #splash .info-card .lbl { font-size: .8rem; color: #aaa; margin-top: .2rem; }

  #splash .instructions {

    max-width: 560px;

    font-size: .95rem;

    line-height: 1.8;

    color: #ccc;

    margin-bottom: 2.5rem;

    text-align: left;

  }

  #splash .instructions li { margin-left: 1.2rem; margin-bottom: .4rem; }

  #btn-start {

    font-family: 'Playfair Display', serif;

    font-size: 1.2rem;

    padding: .9rem 3rem;

    background: var(--accent);

    color: #fff;

    border: none;

    border-radius: 4px;

    cursor: pointer;

    letter-spacing: .05em;

    transition: background .2s, transform .1s;

  }

  #btn-start:hover { background: #a93226; transform: translateY(-2px); }

  /* ── MAIN LAYOUT ── */

  #app { display: none; flex-direction: column; min-height: 100vh; }

  /* ── TOP BAR ── */

  #topbar {

    position: sticky; top: 0; z-index: 100;

    background: var(--ink);

    color: var(--paper);

    display: flex; align-items: center; justify-content: space-between;

    padding: .6rem 1.5rem;

    box-shadow: 0 2px 8px rgba(0,0,0,.3);

  }

  #topbar .logo { font-family: 'Playfair Display', serif; font-size: 1.1rem; letter-spacing: .04em; }

  #topbar .logo span { color: var(--gold); }

  #timer-display {

    font-family: 'JetBrains Mono', monospace;

    font-size: 1.4rem;

    font-weight: 600;

    color: var(--gold);

    letter-spacing: .1em;

  }

  #timer-display.warning { color: #e74c3c; animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }

  #btn-submit-top {

    font-size: .85rem;

    padding: .45rem 1.2rem;

    background: var(--accent);

    color: #fff;

    border: none;

    border-radius: 4px;

    cursor: pointer;

    font-family: 'Source Serif 4', serif;

    transition: background .2s;

  }

  #btn-submit-top:hover { background: #a93226; }

  /* ── HIGHLIGHT TOOLBAR ── */

  #highlight-bar {

    background: var(--cream);

    border-bottom: 1px solid var(--border);

    display: flex; align-items: center; gap: .5rem;

    padding: .4rem 1.5rem;

    flex-wrap: wrap;

  }

  #highlight-bar span { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-right: .3rem; }

  .hl-btn {

    width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(0,0,0,.2);

    cursor: pointer; transition: transform .15s;

  }

  .hl-btn:hover { transform: scale(1.2); }

  .hl-btn.active { border-color: var(--ink); transform: scale(1.15); }

  .hl-btn[data-color=&quot;yellow&quot;] { background: #ffe632; }

  .hl-btn[data-color=&quot;blue&quot;] { background: #64b4ff; }

  .hl-btn[data-color=&quot;green&quot;] { background: #50c878; }

  .hl-btn[data-color=&quot;pink&quot;] { background: #ff78a0; }

  .hl-btn[data-color=&quot;none&quot;] { background: #fff; position: relative; }

  .hl-btn[data-color=&quot;none&quot;]::after {

    content: '✕'; position: absolute; inset: 0; display: flex;

    align-items: center; justify-content: center;

    font-size: 10px; color: #888;

  }

  #erase-btn {

    margin-left: .5rem; font-size: .75rem; padding: .2rem .6rem;

    background: none; border: 1px solid var(--border); border-radius: 3px;

    cursor: pointer; color: var(--muted);

    font-family: 'Source Serif 4', serif;

  }

  #erase-btn:hover { background: var(--border); }

  /* ── PART TABS ── */

  #part-tabs {

    background: var(--cream);

    border-bottom: 2px solid var(--border);

    display: flex;

  }

  .part-tab {

    flex: 1; padding: .7rem; text-align: center;

    font-size: .85rem; font-weight: 600;

    letter-spacing: .05em; text-transform: uppercase;

    cursor: pointer; border: none; background: none;

    color: var(--muted);

    border-bottom: 3px solid transparent;

    transition: color .2s, border-color .2s;

    font-family: 'Source Serif 4', serif;

  }

  .part-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .part-tab .q-range { display: block; font-size: .7rem; font-weight: 400; margin-top: .1rem; }

  /* ── CONTENT ── */

  #content { flex: 1; padding: 1.5rem; max-width: 900px; margin: 0 auto; width: 100%; }

  .part-section { display: none; }

  .part-section.active { display: block; }

  /* ── AUDIO LINK ── */

  .audio-link-wrapper {

    display: flex; align-items: center; gap: 1rem;

    background: var(--cream); border: 1.5px solid var(--border);

    border-radius: 8px; padding: .9rem 1.2rem;

    margin-bottom: 1.5rem;

  }

  .audio-icon {

    width: 42px; height: 42px; border-radius: 50%;

    background: var(--accent); color: #fff;

    display: flex; align-items: center; justify-content: center;

    font-size: 1.1rem; flex-shrink: 0;

  }

  .audio-link-text { flex: 1; }

  .audio-link-text .audio-part-label {

    font-size: .72rem; text-transform: uppercase; letter-spacing: .1em;

    color: var(--muted); margin-bottom: .2rem;

  }

  .audio-link-text a {

    font-size: .95rem; font-weight: 600; color: var(--accent2);

    text-decoration: none;

    word-break: break-all;

  }

  .audio-link-text a:hover { text-decoration: underline; }

  .audio-link-text .audio-hint {

    font-size: .78rem; color: var(--muted); margin-top: .2rem;

    font-style: italic;

  }

  /* ── SECTION HEADERS ── */

  .part-title {

    font-family: 'Playfair Display', serif;

    font-size: 1.5rem;

    border-bottom: 2px solid var(--accent);

    padding-bottom: .4rem;

    margin-bottom: 1.2rem;

    display: flex; align-items: baseline; gap: 1rem;

  }

  .part-title .q-range-label {

    font-family: 'Source Serif 4', serif;

    font-size: .85rem; font-weight: 400;

    color: var(--muted);

  }

  .section-instruction {

    font-style: italic; color: var(--muted);

    font-size: .92rem; margin-bottom: .8rem;

    line-height: 1.6;

  }

  /* ── INFO BOX ── */

  .info-box {

    background: var(--cream); border: 1px solid var(--border);

    border-radius: 6px; padding: 1rem 1.2rem;

    margin-bottom: 1.2rem;

    font-size: .9rem; line-height: 1.7;

  }

  .info-box table { width: 100%; border-collapse: collapse; }

  .info-box td { padding: .3rem .5rem; vertical-align: top; }

  .info-box .opt-key { font-weight: 700; width: 2rem; }

  /* ── QUESTIONS ── */

  .question-block { margin-bottom: 1.4rem; }

  .question-text {

    font-size: .97rem; line-height: 1.7;

    margin-bottom: .5rem;

    cursor: text; user-select: text;

  }

  .question-text strong { font-weight: 700; }

  .q-num { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--accent); }

  /* ── MC OPTIONS ── */

  .mc-options { display: flex; flex-direction: column; gap: .4rem; margin-top: .3rem; }

  .mc-option {

    display: flex; align-items: flex-start; gap: .6rem;

    padding: .5rem .7rem; border-radius: 5px;

    border: 1.5px solid var(--border); cursor: pointer;

    transition: border-color .2s, background .2s;

    font-size: .92rem; line-height: 1.5;

    user-select: text;

  }

  .mc-option:hover { border-color: var(--accent2); background: #f0f7ff; }

  .mc-option.selected { border-color: var(--accent2); background: #e8f3fc; }

  .mc-option .opt-letter { font-weight: 700; color: var(--accent2); min-width: 1.1rem; }

  /* ── SHORT ANSWER ── */

  .short-answer-input {

    font-family: 'Source Serif 4', serif;

    font-size: .95rem;

    border: none; border-bottom: 2px solid var(--border);

    background: transparent;

    padding: .3rem .2rem;

    width: 200px;

    color: var(--ink);

    transition: border-color .2s;

    outline: none;

  }

  .short-answer-input:focus { border-bottom-color: var(--accent2); }

  /* ── MATCHING QUESTION ── */

  .matching-select {

    font-family: 'Source Serif 4', serif;

    font-size: .9rem;

    border: 1.5px solid var(--border);

    border-radius: 4px;

    padding: .3rem .5rem;

    background: #fff;

    color: var(--ink);

    cursor: pointer;

    outline: none;

    transition: border-color .2s;

    margin-left: .4rem;

  }

  .matching-select:focus { border-color: var(--accent2); }

  /* ── FLOW CHART ── */

  .flowchart { display: flex; flex-direction: column; gap: 0; }

  .flow-box {

    background: var(--cream); border: 1.5px solid var(--border);

    border-radius: 6px; padding: .8rem 1rem;

    font-size: .92rem; line-height: 1.7;

    position: relative;

    user-select: text;

  }

  .flow-arrow {

    text-align: center; color: var(--muted); font-size: 1.2rem;

    padding: .2rem 0;

    line-height: 1;

  }

  /* ── NOTES BOX ── */

  .notes-box {

    background: var(--cream); border: 1.5px solid var(--border);

    border-radius: 6px; padding: 1rem 1.2rem;

    font-size: .92rem; line-height: 1.85;

    user-select: text;

  }

  .notes-box .notes-title {

    font-family: 'Playfair Display', serif;

    font-size: 1.05rem;

    text-align: center;

    margin-bottom: .8rem;

    color: var(--accent);

  }

  /* ── NAV BUTTONS ── */

  .nav-row {

    display: flex; justify-content: space-between; align-items: center;

    margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border);

  }

  .nav-btn {

    font-family: 'Source Serif 4', serif;

    padding: .6rem 1.8rem; font-size: .95rem;

    border: 1.5px solid var(--border); border-radius: 4px;

    cursor: pointer; background: #fff; color: var(--ink);

    transition: background .2s, border-color .2s;

  }

  .nav-btn:hover { background: var(--cream); border-color: var(--muted); }

  .nav-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

function goToPartFromNav(idx) {

  currentPart = idx;

  document.querySelectorAll('.part-section').forEach((s,i) => s.classList.toggle('active', i === idx));

  document.querySelectorAll('.part-tab').forEach((t,i) => t.classList.toggle('active', i === idx));

  window.scrollTo({ top: 0, behavior: 'smooth' });

}

// ═══════════════════════════════════════════════

//  INPUT LISTENERS

// ═══════════════════════════════════════════════

function attachInputListeners() {

  // Short answer inputs

  document.querySelectorAll('.short-answer-input').forEach(input => {

    input.addEventListener('input', () => {

      const q = parseInt(input.dataset.q);

      userAnswers[q] = input.value.trim();

      updatePills();

    });

  });

  // Select (matching)

  document.querySelectorAll('.matching-select').forEach(sel => {

    sel.addEventListener('change', () => {

      const q = parseInt(sel.dataset.q);

      userAnswers[q] = sel.value;

      updatePills();

    });

  });

  // MC options

  document.querySelectorAll('.mc-option').forEach(opt => {

    opt.addEventListener('click', () => {

      const q = parseInt(opt.dataset.q);

      document.querySelectorAll(`.mc-option[data-q=&quot;${q}&quot;]`).forEach(o => o.classList.remove('selected'));

      opt.classList.add('selected');

      userAnswers[q] = opt.dataset.val;

      updatePills();

    });

  });

}

// ═══════════════════════════════════════════════

//  PROGRESS PILLS

// ═══════════════════════════════════════════════

function buildProgressPills() {

  PART_RANGES.forEach((part, pi) => {

    const container = document.getElementById(`pills-${pi}`);

    part.qs.forEach(q => {

      const pill = document.createElement('div');

      pill.className = 'prog-pill';

      pill.id = `pill-${q}`;

      pill.textContent = q;

      pill.title = `Question ${q}`;

      pill.addEventListener('click', () => {

        goToPartFromNav(pi);

        setTimeout(() => {

          const el = document.querySelector(`[data-q=&quot;${q}&quot;]`);

          if (el) el.closest('.question-block, .flow-box, .notes-box')?.scrollIntoView({ behavior: 'smooth', block: 'center' });

        }, 100);

      });

      container.appendChild(pill);

    });

  });

}

function updatePills() {

  for (let q = 1; q <= 40; q++) {

    const pill = document.getElementById(`pill-${q}`);

    if (pill) pill.classList.toggle('answered', !!(userAnswers[q] &amp;&amp; userAnswers[q] !== ''));

  }

}

// ═══════════════════════════════════════════════

//  HIGHLIGHT SYSTEM

// ═══════════════════════════════════════════════

document.querySelectorAll('.hl-btn').forEach(btn => {

  btn.addEventListener('click', () => {

    document.querySelectorAll('.hl-btn').forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    activeHighlightColor = btn.dataset.color;

  });

});

// Highlightable zones — includes all question content areas

const HIGHLIGHT_ZONES = [

  '.question-text', '.mc-option', '.flow-box',

  '.notes-box', '.info-box', '.section-instruction',

  '.part-title', '.notes-title'

];

function isInHighlightZone(node) {

  const el = node.nodeType === 3 ? node.parentElement : node;

  return el &amp;&amp; el.closest(HIGHLIGHT_ZONES.join(','));

}

document.addEventListener('mouseup', (e) => {

  // Don't trigger when clicking highlight toolbar itself

  if (e.target.closest('#highlight-bar')) return;

  const sel = window.getSelection();

  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;

  const selText = sel.toString().trim();

  if (!selText) return;

  const range = sel.getRangeAt(0);

  // Check both start and end of selection are within a highlight zone

  if (!isInHighlightZone(range.startContainer) &amp;&amp; !isInHighlightZone(range.endContainer)) return;

  if (activeHighlightColor === 'none') {

    // Remove all highlights that intersect the selection

    const marks = Array.from(document.querySelectorAll('.hl-yellow,.hl-blue,.hl-green,.hl-pink'));

    marks.forEach(mark => {

      if (sel.containsNode(mark, true)) {

        const parent = mark.parentNode;

        while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);

        parent.removeChild(mark);

        parent.normalize();

      }

    });

    sel.removeAllRanges();

    return;

  }

  // Apply highlight by extracting and re-inserting contents wrapped in a <mark>

  try {

    // Clone the range contents

    const fragment = range.extractContents();

    const mark = document.createElement('mark');

    mark.className = `hl-${activeHighlightColor}`;

    mark.appendChild(fragment);

    range.insertNode(mark);

    sel.removeAllRanges();

  } catch (err) {

    // If extractContents fails (e.g. crossing form element boundaries), try surroundContents

    try {

      const mark = document.createElement('mark');

      mark.className = `hl-${activeHighlightColor}`;

      range.surroundContents(mark);

      sel.removeAllRanges();

    } catch (err2) {

      sel.removeAllRanges();

    }

  }

});

// ═══════════════════════════════════════════════

//  SUBMIT

// ═══════════════════════════════════════════════

function confirmSubmit() {

  const answered = Object.keys(userAnswers).filter(k => userAnswers[k] !== '').length;

  const unanswered = 40 - answered;

  if (unanswered > 0) {

    if (!confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`)) return;

  }

  submitTest();

}

function submitTest() {

  testSubmitted = true;

  // Collect answers and score for Google Form submission
  let _total = 0;
  const _answersList = [];
  for (let q = 1; q <= 40; q++) {
    const val = (userAnswers[q] || '').toString().trim();
    _answersList.push('Q' + q + ': ' + (val || '(blank)'));
    if (isCorrect(q)) _total++;
  }
  try {
    window.parent.postMessage({
      type: 'sectionData',
      section: 'listening',
      answers: _answersList.join(' | '),
      score: _total
    }, '*');
  } catch(e2){}
  try { window.parent.postMessage({type:'sectionDone', from:'listening'}, '*'); } catch(e){}

  clearInterval(timerInterval);

  document.getElementById('timeout-modal').classList.remove('show');

  document.getElementById('app').style.display = 'none';

  buildResults();

  document.getElementById('results').style.display = 'block';

  window.scrollTo({ top: 0, behavior: 'smooth' });

}

// ═══════════════════════════════════════════════

//  RESULTS

// ═══════════════════════════════════════════════

function normalise(ans) {

  return (ans || '').toString().trim().toLowerCase().replace(/\s+/g, ' ');

}

function isCorrect(q) {

  const key = normalise(ANSWER_KEY[q].answer);

  const user = normalise(userAnswers[q]);

  return user === key;

}

function estimateBand(score) {

  if (score >= 39) return 'Band 9.0';

  if (score >= 37) return 'Band 8.5';

  if (score >= 35) return 'Band 8.0';

  if (score >= 33) return 'Band 7.5';

  if (score >= 30) return 'Band 7.0';

  if (score >= 27) return 'Band 6.5';

  if (score >= 23) return 'Band 6.0';

  if (score >= 20) return 'Band 5.5';

  if (score >= 16) return 'Band 5.0';

  if (score >= 13) return 'Band 4.5';

  return 'Band 4.0';

}

function buildResults() {

  let total = 0;

  for (let q = 1; q <= 40; q++) { if (isCorrect(q)) total++; }

  document.getElementById('score-big').textContent = total;

  document.getElementById('band-estimate').textContent =

    `Estimated Band: ${estimateBand(total)}`;

  // Part summary cards only — no correct/incorrect answer reveal

  const summaryEl = document.getElementById('part-summary');

  summaryEl.innerHTML = '';

  PART_RANGES.forEach(part => {

    const correct = part.qs.filter(q => isCorrect(q)).length;

    const card = document.createElement('div');

    card.className = 'part-card';

    card.innerHTML = `

      <div class=&quot;part-label&quot;>${part.label}</div>

      <div class=&quot;part-score&quot;>${correct}</div>

      <div class=&quot;part-fraction&quot;>/ ${part.qs.length} answered</div>

    `;

    summaryEl.appendChild(card);

  });

  // No detailed answer review shown

  document.getElementById('answers-review').innerHTML = '';

}

function escapeHtml(str) {

  return str.replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;');

}

function restartTest() {

  userAnswers = {};

  testSubmitted = false;

  secondsLeft = 35 * 60;

  currentPart = 0;

  // Reset UI

  document.querySelectorAll('.short-answer-input').forEach(i => i.value = '');

  document.querySelectorAll('.matching-select').forEach(s => s.value = '');

  document.querySelectorAll('.mc-option').forEach(o => o.classList.remove('selected'));

  // Remove highlights

  document.querySelectorAll('mark.hl-yellow, mark.hl-blue, mark.hl-green, mark.hl-pink').forEach(m => {

    const parent = m.parentNode;

    while (m.firstChild) parent.insertBefore(m.firstChild, m);

    parent.removeChild(m);

    parent.normalize();

  });

  updatePills();

  document.getElementById('results').style.display = 'none';

  document.getElementById('app').style.display = 'flex';

  goToPartFromNav(0);

  startTimer();

  window.scrollTo({ top: 0 });

}

</script>

                <!-- PASSAGE 1: Katherine Mansfield -->

                <div id=&quot;passage-text-1&quot; class=&quot;reading-passage&quot;>

                    <h4>Katherine Mansfield</h4>

                    <p>Katherine Mansfield was a modernist writer of short fiction who was born and brought up in New Zealand. Katherine Mansfield Beauchamp Murry was born in 1888, into a prominent family in Wellington, New Zealand. She became one of New Zealand's best-known writers, using the pen name of Katherine Mansfield. The daughter of a banker, and born into a middle-class family, she was also a first cousin of Countess Elizabeth von Arnim, a distinguished novelist in her time. Mansfield had two older sisters and a younger brother. Her father, Harold Beauchamp, went on to become the chairman of the Bank of New Zealand. In 1893, the Mansfield family moved to Karori, a suburb of Wellington, where Mansfield would spend the happiest years of her childhood; she later used her memories of this time as an inspiration for her <em>Prelude</em> story.</p>

                    <p>Her first published stories appeared in the High School Reporter and the Wellington Girls' High School magazine in 1898 and 1899. In 1902, she developed strong feelings for a musician who played the cello, Arnold Trowell, although her feelings were not, for the most part, returned. Mansfield herself was an accomplished cellist, having received lessons from Trowell's father. Mansfield wrote in her journals of feeling isolated to some extent in New Zealand, and, in general terms, of her interest in the Maori people (New Zealand's native people), who were often portrayed in a sympathetic light in her later stories, such as <em>How Pearl Button Was Kidnapped</em>.</p>

                    <p>She moved to London in 1903, where she attended Queen's College, along with her two sisters. Mansfield recommenced playing the cello, an occupation that she believed, during her time at Queen's, she would take up professionally. She also began contributing to the college newspaper, with such a dedication to it that she eventually became its editor. She was particularly interested in the works of the French writers of this period and the 19th-century British writer, Oscar Wilde, and she was appreciated amongst fellow students at Queen's for her lively and charismatic approach to life and work. She met fellow writer Ida Baker, a South African, at the college, and the pair became lifelong friends. Mansfield did not actively support the suffragette movement in the UK. Women in New Zealand had gained the right to vote in 1893.</p>

                    <p>Mansfield first began journeying into other parts of Europe in the period 1903–1906, mainly to Belgium and Germany. After finishing her schooling in England, she returned to her New Zealand home in 1906, only then beginning to write short stories in a serious way. She had several works published in Australia in a magazine called <em>Native Companion</em>, which was her first paid writing work, and by this time, she had her mind set on becoming a professional writer. It was also the first occasion on which she used the pseudonym 'K. Mansfield.'</p>

                    <p>Mansfield rapidly grew discontented with the provincial New Zealand lifestyle, and with her family. Two years later, she headed again to London. Her father sent her an annual subsidy of £100 for the rest of her life. In later years, she would express both admiration and disdain for New Zealand in her journals.</p>

                    <p>In 1911, Mansfield met John Middleton Murry, the Oxford scholar and editor of the literary magazine <em>Rhythm</em>. They were later to marry in 1918. Mansfield became a co-editor of <em>Rhythm</em>, which was subsequently called <em>The Blue Review</em>, in which more of her works were published. She and Murry lived in various houses in England and briefly in Paris. <em>The Blue Review</em> failed to gain enough readers and was no longer published. Their attempt to set up as writers in Paris was cut short by Murry's bankruptcy, which resulted from the failure of this and other journals. Life back in England meant frequently changed addresses and very limited funds.</p>

                    <p>Between 1915 and 1918, Mansfield moved between England and Bandol, France. She and Murry developed close contact with other well-known writers of the time such as D.H. Lawrence, Bertrand Russell, and Aldous Huxley. By October 1918, Mansfield had become seriously ill; she had been diagnosed with tuberculosis and was advised to enter a sanatorium. She could no longer spend time with writers in London. In the autumn of 1918, she was so ill that she decided to go to Ospedale in Italy. It was the publication of <em>Bliss and Other Stories</em> in 1920 that was to solidify Mansfield's reputation as a writer.</p>

                    <p>Mansfield also spent time in Menton, France, as the tenant of her father's cousin at 'The Villa Isola Bella'. There she wrote what she pronounced to be '...the only story that satisfies me to any extent.'</p>

                    <p>Mansfield produced a great deal of work in the final years of her life, and much of her prose and poetry remained unpublished at her death in 1923. After her death, her husband, Murry, took on the task of editing and publishing her works. His efforts resulted in two additional volumes of short stories, <em>The Doves' Nest</em> and <em>Something Childish</em>, published in 1923 and 1924 respectively, the publication of her poems as well as a collection of critical writings (<em>Novels and Novelists</em>) and a number of editions of Mansfield's previously unpublished letters and journals.</p>

                </div>

                <!-- PASSAGE 2: Australian Parrots -->

                <div id=&quot;passage-text-2&quot; class=&quot;reading-passage hidden&quot;>

                    <h4>Australian Parrots and Their Adaptation to Habitat Change</h4>

                    <p><strong>A</strong>&amp;nbsp;&amp;nbsp;Parrots are found across the tropic and in all southern hemisphere continents except Antarctica, but nowhere do they display such a richness of diversity and form as in Australia. One-sixth of the world's 345 parrot species are found there, and Australia has long been renowned for the number and variety of its parrots.</p>

                    <p><strong>B</strong>&amp;nbsp;&amp;nbsp;In the 16th century, the German cartographer Mercator made a world map that included a place, somewhere near present-day Australia, that he named Terra Psittacorum – the Land of Parrots – and the first European settlers in Australia often referred to the country as Parrot Land. In 1865, the celebrated British naturalist and wildlife artist John Gould said: 'No group of birds gives Australia so tropical and benign an air as the numerous species of this great family by which it is tenanted.'</p>

                    <p><strong>C</strong>&amp;nbsp;&amp;nbsp;Parrots are descendants of an ancient line. Due to their great diversity, and since most species inhabit Africa, Australia and South America, it seems almost certain that parrots originated millions of years ago on the ancient southern continent of Gondwana, before it broke up into the separate southern hemisphere continents we know today. Much of Gondwana comprised vast rainforests intersected by huge slow-flowing rivers and expansive lakes, but by eight million years ago, great changes were underway. The centre of the continent of Australia had begun to dry out, and the rainforests that once covered it gradually contracted to the continental margins, where, to a limited extent, they still exist today.</p>

                    <p><strong>D</strong>&amp;nbsp;&amp;nbsp;The creatures that remained in those shrinking rainforests had to adapt to the drier conditions or face extinction. Reacting to these desperate circumstances, the parrot family, typically found in jungles in other parts of the world, has populated some of Australia's harshest environments. The parrots spread from ancestral forests through eucalypt woodlands to colonies in the central deserts of Australia, and as a consequence they diversified into a wide range of species with adaptations that reflect the many changes animals and plants had to make to survive in these areas.</p>

                    <p><strong>E</strong>&amp;nbsp;&amp;nbsp;These evolutionary pressures helped mould keratin, the substance from which beaks are made, into a range of tools capable of gathering the new food types favoured by various species of parrot. The size of a parrot's short, blunt beak and the length of that beak's curved upper section are related to the type of food each species eats. Some have comparatively long beaks that are perfect for extracting seeds from fruit; others have broader and stronger beaks that are designed for cracking hard seeds.</p>

                    <p><strong>F</strong>&amp;nbsp;&amp;nbsp;Differently shaped beaks are not the only adaptations that have been made during the developing relationship between parrots and their food plants. Like all of Australia's many honey-eating birds, the rainbow-coloured lorikeets and the flowers on which they feed have long co-evolved with features such as the shape and colour of the flowers adapted to the bird's particular needs: red is the most attractive colour to birds, and thus flowers which depend on birds for pollination are more often red, and lorikeets' tongues have bristles which help them to collect as much pollen as possible.</p>

                    <p><strong>G</strong>&amp;nbsp;&amp;nbsp;Today, most of Australia's parrots inhabit woodland and open forest, and their numbers decline towards both deserts and wetter areas. The majority are nomadic to some degree, moving around to take advantage of feeding and breeding places. Two of the dry country parrots, the pink and grey galah and the pink, white and yellow corella, have expanded their ranges in recent years. They are among the species that have adapted well to the changes brought about by European settlement; forest clearing created grasslands where galahs and corellas thrive.</p>

                    <p><strong>H</strong>&amp;nbsp;&amp;nbsp;But other parrot species did not fare so well when their environments were altered. The clearing of large areas of rainforest is probably responsible for the disappearance of the double-eyed fig parrot, and numbers of ground parrots declined when a great part of their habitat was destroyed by the draining of coastal swamps. Even some parrot species that benefited from forest clearing at first are now confronted by a shortage of nesting sites due to further man-made changes.</p>

                    <p><strong>I</strong>&amp;nbsp;&amp;nbsp;New conditions also sometimes favour an incoming species over one that originally inhabited the area. For example, after farmers cleared large areas of forest on Kangaroo Island off the coast of South Australia, the island was colonised by galahs. They were soon going down holes and destroying black cockatoo eggs in order to take the hole for their own use. Their success precipitated a partial collapse in the black cockatoo population when the latter lost the struggle for scarce nesting hollows.</p>

                    <p><strong>J</strong>&amp;nbsp;&amp;nbsp;There may be no final answer to ensuring an equitable balance between parrot species. Nest box programmes help ease the shortage of nesting sites in some places, but there are not enough, they are expensive and they are not an adequate substitute for large, old trees, such as the habitat they represent and nectar, pollen and seeds they provide. Competition between parrots for nest sites is a result of the changes we humans have made to the Earth. We are the most widespread and dangerous competitors that parrots have ever had to face, but we also have the knowledge and skill to maintain the wonderfully rich diversity of Australia's parrots. All we need is the will to do so.</p>

                </div>

                <!-- PASSAGE 3: Yawning -->

                <div id=&quot;passage-text-3&quot; class=&quot;reading-passage hidden&quot;>

                    <h4>Yawning</h4>

                    <p><em>How and why we yawn still presents problems for researchers in an area which has only recently been opened up to study.</em></p>

                    <p>When Robert R. Provine began studying yawning in the 1960s, it was difficult for him to convince research students of the merits of 'yawning science'. Although it may appear quirky to some, Provine's decision to study yawning was a logical extension of his research in developmental neuroscience.</p>

                    <p>The verb 'to yawn' is derived from the Old English <em>ganien</em> or <em>ginian</em>, meaning to gape or open wide. But in addition to gaping jaws, yawning has significant features that are easy to observe and analyse. Provine 'collected' yawns to study by using a variation of the contagion response. He asked people to 'think about yawning' and, once they began to yawn, to depress a button that would record from the start of the yawn to the exhalation at its end.</p>

                    <p>Provine's early discoveries can be summarised as follows: the yawn is highly stereotyped but not invariant in its duration and form. It is an excellent example of the instinctive 'fixed action pattern' of classical animal-behaviour study, or ethology. It is not a reflex (short-duration, rapid, proportional response to a simple stimulus), but, once started, a yawn progresses with the inevitability of a sneeze. The standard yawn runs its course over about six seconds on average, but its duration can range from about three seconds to much longer than the average. There are no half-yawns: this is an example of the typical intensity of fixed action patterns and a reason why you cannot stifle yawns. Just like a cough, yawns can come in bouts with a highly variable inter-yawn interval, which is generally about 68 seconds but rarely more than 70. There is no relation between yawn frequency and duration: producers of short or long yawns do not compensate by yawning more or less often. Furthermore, Provine's hypotheses about the form and function of yawning can be tested by three informative yawn variants which can be used to look at the roles of the nose, the mouth and the jaws.</p>

                    <p><strong>i) The closed nose yawn</strong><br>Subjects are asked to pinch their nose closed when they feel themselves start to yawn. Most subjects report being able to perform perfectly normal closed nose yawns. This indicates that the inhalation at the onset of a yawn, and the exhalation at its end, need not involve the nostrils – the mouth provides a sufficient airway.</p>

                    <p><strong>ii) The clenched teeth yawn</strong><br>Subjects are asked to clench their teeth when they feel themselves start to yawn but allow themselves to inhale normally through their open lips and clenched teeth. This variant gives one the sensation of being stuck mid-yawn. This shows that gaping of the jaws is an essential component of the fixed action pattern of the yawn, and unless it is accomplished, the program (or pattern) will not run to completion. The yawn is also shown to be more than a deep breath, because, unlike normal breathing, inhalation and exhalation cannot be performed so well through the clenched teeth as through the nose.</p>

                    <p><strong>iii) The nose yawn</strong><br>This variant tests the adequacy of the nasal airway to sustain a yawn. Unlike normal breathing, which can be performed equally well through the mouth or nose, yawning is impossible via nasal inhalation alone. As with the clenched teeth yawn, the nose yawn provides the unfulfilling sensation of being stuck in mid-yawn. Exhalation, on the other hand, can be accomplished equally well through nose or mouth. Through this methodology Provine demonstrated that inhalation through the oral airway and the gaping of jaws are necessary for normal yawns. The motor program for yawning will not run to completion without feedback that these parts of the program have been accomplished.</p>

                    <p>But yawning is a powerful, generalised movement that involves much more than airway manoeuvres and jaw-gaping. When yawning you also stretch your facial muscles, tilt your head back, narrow or close your eyes, produce tears, salivate, open the Eustachian tubes of your middle ear and perform many other, yet unspecified, cardiovascular and respiratory acts. Perhaps the yawn shares components with other behaviour. For example, is the yawn a kind of 'slow sneeze' or is the sneeze a 'fast yawn'? Both share common respiratory and other features including jaw gaping, eye closing and head tilting.</p>

                    <p>Yawning and stretching share properties and may be performed together as parts of a global motor complex. Studies by J.I.P. deVries et al. in the early 1980s, charting movement in the developing foetus using ultrasound, observed a link between yawning and stretching. The most extraordinary demonstration of the yawn-stretch linkage occurs in many people paralysed on one side of their body because of brain damage caused by a stroke; the prominent British neurologist Sir Francis Walshe noted in 1923 that when these people yawn, they are startled and mystified to observe that their otherwise paralysed arm rises and flexes automatically in what neurologists term an 'associated response'. Yawning apparently activates undamaged, unconsciously controlled connections between the brain and the motor system, causing the paralysed limb to move. It is not known whether the associated response is a positive prognosis for recovery, nor whether yawning is therapeutic for prevention of muscular deterioration.</p>

                    <p>Provine speculated that, in general, yawning may have many functions, and selecting a single function from the available options may be an unrealistic goal. Yawning appears to be associated with a change of behavioural state, switching from one activity to another. Yawning is also a reminder that ancient and unconscious behaviour linking us to the animal world lurks beneath the veneer of culture, rationality and language.</p>

                </div>

    <!-- Context Menu -->

    <script>

    document.addEventListener('DOMContentLoaded', () => {

        // STATE

        let currentPassage = 1;

        let currentQuestion = 1;

        let selectedRange = null;

        let timeInSeconds = 3600;

        let timerInterval;

        // DOM

        const timerDisplay = document.querySelector('.timer-display');

        const timerToggleButton = document.getElementById('timer-toggle-btn');

        const timerResetButton = document.getElementById('timer-reset-btn');

        const deliverButton = document.getElementById('deliver-button');

        const resizer = document.getElementById('resizer');

        const passagePanel = document.getElementById('passage-panel');

        const questionsPanel = document.getElementById('questions-panel');

        const contextMenu = document.getElementById('contextMenu');

        // Icons

        const playIcon = '<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; height=&quot;24px&quot; viewBox=&quot;0 0 24 24&quot; width=&quot;24px&quot;><path d=&quot;M0 0h24v24H0V0z&quot; fill=&quot;none&quot;/><path d=&quot;M8 5v14l11-7L8 5z&quot;/></svg>';

        const pauseIcon = '<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; height=&quot;24px&quot; viewBox=&quot;0 0 24 24&quot; width=&quot;24px&quot;><path d=&quot;M0 0h24v24H0V0z&quot; fill=&quot;none&quot;/><path d=&quot;M6 19h4V5H6v14zm8-14v14h4V5h-4z&quot;/></svg>';

        // ANSWERS

        const correctAnswers = {

            '1':'FALSE','2':'NOT GIVEN','3':'TRUE','4':'FALSE','5':'FALSE','6':'NOT GIVEN',

            '7':'1906','8':'Australia','9':'family','10':'bankruptcy','11':'writers','12':'reputation','13':'husband',

            '14':'I','15':'F','16':'G','17':'D','18':'C','19':'H',

            '20':'C','21':'D','22':'B',

            '23':'one-sixth','24':'16th century','25':'Mercator','26':'John Gould',

            '27':'K','28':'H','29':'D','30':'J','31':'E','32':'B',

            '33':'B','34':'C','35':'D','36':'C','37':'B',

            '38':'YES','39':'NOT GIVEN','40':'YES'

        };

        // Part → question range

        const partRanges = { 1:[1,13], 2:[14,26], 3:[27,40] };

        function getPartForQuestion(q) {

            if (q <= 13) return 1;

            if (q <= 26) return 2;

            return 3;

        }

        // Build sub-question bubbles

        function buildSubQuestions() {

            for (let part = 1; part <= 3; part++) {

                const container = document.getElementById(`sq-part-${part}`);

                container.innerHTML = '';

                const [s, e] = partRanges[part];

                for (let i = s; i <= e; i++) {

                    const btn = document.createElement('button');

                    btn.className = 'subQuestion';

                    btn.textContent = i;

                    btn.onclick = (ev) => { ev.stopPropagation(); goToQuestion(i); };

                    btn.id = `sq-btn-${i}`;

                    container.appendChild(btn);

                }

            }

        }

        function isQuestionAnswered(i) {

            const textInput = document.querySelector(`input[type=&quot;text&quot;]#q${i}`);

            if (textInput) return textInput.value.trim() !== '';

            const sel = document.querySelector(`select#q${i}`);

            if (sel) return sel.value !== '';

            const radio = document.querySelector(`input[name=&quot;q${i}&quot;]:checked`);

            if (radio) return true;

            return false;

        }

        function updateAllIndicators() {

            for (let part = 1; part <= 3; part++) {

                const [s, e] = partRanges[part];

                let count = 0;

                for (let i = s; i <= e; i++) {

                    if (isQuestionAnswered(i)) count++;

                    const btn = document.getElementById(`sq-btn-${i}`);

                    if (btn) {

                        btn.classList.toggle('answered', isQuestionAnswered(i));

                        btn.classList.toggle('active', i === currentQuestion);

                    }

                }

                const wrapper = document.getElementById(`part-btn-${part}`);

                if (wrapper) {

                    const span = wrapper.querySelector('.attemptedCount');

                    if (span) span.textContent = `${count} of ${e - s + 1}`;

                }

            }

        }

        function switchToPart(part) {

            currentPassage = part;

            for (let p = 1; p <= 3; p++) {

                document.getElementById(`passage-text-${p}`).classList.toggle('hidden', p !== part);

                document.getElementById(`questions-${p}`).classList.toggle('hidden', p !== part);

                document.getElementById(`part-header-${p}`).classList.toggle('hidden', p !== part);

                const wrapper = document.getElementById(`part-btn-${p}`);

                wrapper.classList.toggle('selected', p === part);

            }

            goToQuestion(partRanges[part][0]);

        }

        function goToQuestion(qNum) {

            currentQuestion = qNum;

            const part = getPartForQuestion(qNum);

            if (currentPassage !== part) switchToPart(part);

            // scroll question into view

            const allQEls = questionsPanel.querySelectorAll('[data-q-start]');

            allQEls.forEach(el => {

                const s = parseInt(el.dataset.qStart);

                const e = parseInt(el.dataset.qEnd);

                if (qNum >= s &amp;&amp; qNum <= e) {

                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

                }

            });

            // deactivate old active input

            document.querySelectorAll('.answer-input.active-input').forEach(el => el.classList.remove('active-input'));

            const activeInput = document.getElementById(`q${qNum}`);

            if (activeInput) activeInput.classList.add('active-input');

            updateAllIndicators();

            updateNavArrows();

        }

        function nextQuestion() {

            if (currentQuestion < 40) goToQuestion(currentQuestion + 1);

        }

        function previousQuestion() {

            if (currentQuestion > 1) goToQuestion(currentQuestion - 1);

        }

        function updateNavArrows() {

            document.getElementById('prev-btn').disabled = currentQuestion <= 1;

            document.getElementById('next-btn').disabled = currentQuestion >= 40;

        }

        // Timer

        function updateTimerDisplay() {

            const m = Math.floor(timeInSeconds / 60);

            const s = timeInSeconds % 60;

            timerDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

        }

        function startTimer() {

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {

                timeInSeconds--;

                updateTimerDisplay();

                if (timeInSeconds <= 0) {

                    clearInterval(timerInterval);

                    timerDisplay.textContent = &quot;Time's up!&quot;;

                }

            }, 1000);

            timerToggleButton.innerHTML = pauseIcon;

        }

        // Expose to window so outer script's message handler can call it
        window.startTimer = startTimer;

        function pauseTimer() {

            clearInterval(timerInterval);

            timerToggleButton.innerHTML = playIcon;

        }

        function toggleTimer() {

            if (timerToggleButton.innerHTML.includes('M6 19h4V5H6v14z')) pauseTimer();

            else startTimer();

        }

        function resetTimer() {

            timeInSeconds = 3600;

            updateTimerDisplay();

            startTimer();

        }

        // CHECK ANSWERS

        function checkAnswers() {

            const allInputs = document.querySelectorAll('input, select, textarea');

            allInputs.forEach(inp => inp.disabled = true);

            deliverButton.disabled = true;

            deliverButton.style.cursor = 'not-allowed';

            clearInterval(timerInterval);

            let score = 0;

            const resultsDetails = document.getElementById('results-details');

            resultsDetails.innerHTML = '';

            for (let i = 1; i <= 40; i++) {

                const correct = correctAnswers[String(i)];

                let userAnswer = '';

                let isCorrect = false;

                const textEl = document.querySelector(`input[type=&quot;text&quot;]#q${i}`);

                const selEl = document.querySelector(`select#q${i}`);

                const radioEl = document.querySelector(`input[name=&quot;q${i}&quot;]:checked`);

                if (textEl) {

                    userAnswer = textEl.value.trim();

                    isCorrect = Array.isArray(correct)

                        ? correct.some(a => userAnswer.toLowerCase() === a.toLowerCase())

                        : userAnswer.toLowerCase() === (correct||'').toLowerCase();

                } else if (selEl) {

                    userAnswer = selEl.value;

                    isCorrect = userAnswer === correct;

                } else if (radioEl) {

                    userAnswer = radioEl.value;

                    isCorrect = userAnswer === correct;

                }

                if (isCorrect) score++;

            }

            const band = scoreToBand(score);

            document.getElementById('results-score').textContent = score;

            document.getElementById('results-band').textContent = band;

            resultsDetails.innerHTML = '<p style=&quot;color:#555;font-size:14px;padding:12px 0;&quot;>Answers will be reviewed by your teacher.</p>';

            document.getElementById('results-modal').classList.remove('hidden');

        }


        function scoreToBand(s) {

            if (s >= 39) return '9.0';

            if (s >= 37) return '8.5';

            if (s >= 35) return '8.0';

            if (s >= 33) return '7.5';

            if (s >= 30) return '7.0';

            if (s >= 27) return '6.5';

            if (s >= 23) return '6.0';

            if (s >= 19) return '5.5';

            if (s >= 15) return '5.0';

            if (s >= 13) return '4.5';

            if (s >= 10) return '4.0';

            return 'Below 4.0';

        }

        function closeResultsModal() {

            document.getElementById('results-modal').classList.add('hidden');

        }

        // HIGHLIGHT &amp; NOTE

        function initializeContextMenu() {

            const panels = [passagePanel, questionsPanel];

            document.addEventListener('selectionchange', () => {

                const sel = window.getSelection();

                if (sel &amp;&amp; !sel.isCollapsed &amp;&amp; sel.toString().trim().length > 0) {

                    const range = sel.getRangeAt(0);

                    if (panels.some(p => p.contains(range.commonAncestorContainer))) {

                        selectedRange = range;

                    }

                }

            });

            const showMenu = (e) => {

                const target = e.target;

                const onHL = target.closest('.highlight, .comment-highlight');

                const hasSelection = selectedRange &amp;&amp; selectedRange.toString().trim().length > 0;

                let show = false;

                if (onHL) {

                    document.getElementById('menu-highlight').style.display = 'none';

                    document.getElementById('menu-note').style.display = 'none';

                    document.getElementById('menu-clear').style.display = 'block';

                    document.getElementById('menu-clear-all').style.display = 'block';

                    contextMenu.targetElementForClear = onHL;

                    show = true;

                } else if (hasSelection &amp;&amp; panels.some(p => p.contains(selectedRange.commonAncestorContainer))) {

                    document.getElementById('menu-highlight').style.display = 'flex';

                    document.getElementById('menu-note').style.display = 'flex';

                    document.getElementById('menu-clear').style.display = 'none';

                    document.getElementById('menu-clear-all').style.display = 'block';

                    show = true;

                }

                if (show) {

                    e.preventDefault();

                    contextMenu.style.display = 'block';

                    const mh = contextMenu.offsetHeight, mw = contextMenu.offsetWidth;

                    let left = e.pageX, top = e.pageY - mh - 5;

                    if (left + mw > window.innerWidth) left = window.innerWidth - mw - 5;

                    if (top < 0) top = e.pageY + 5;

                    contextMenu.style.left = `${left}px`;

                    contextMenu.style.top = `${top}px`;

                }

            };

            panels.forEach(p => p.addEventListener('contextmenu', showMenu));

            document.addEventListener('click', (e) => {

                if (contextMenu.style.display === 'block' &amp;&amp; !contextMenu.contains(e.target)) closeContextMenu();

            });

        }

        function closeContextMenu() {

            contextMenu.style.display = 'none';

            selectedRange = null;

        }

        function unwrapElement(el) {

            const parent = el.parentNode;

            if (!parent) return;

            while (el.firstChild) parent.insertBefore(el.firstChild, el);

            parent.removeChild(el);

            parent.normalize();

        }

        window.highlightText = () => {

            if (selectedRange &amp;&amp; !selectedRange.collapsed) {

                let selectedContent = selectedRange.cloneContents();

                if (selectedContent.querySelector('p') !== null) {

                    let i = 0;

                    for (const child of selectedContent.children) {

                        if (i < selectedContent.children.length) {

                            const textToReplace = child.innerHTML;

                            const nextText = selectedContent.children[i + 1]?.innerHTML;

                            const allParagraphs = document.getElementsByTagName('p');

                            for (const p of allParagraphs) {

                                const nextSibling = p.nextElementSibling;

                                const nextSiblingText = nextSibling &amp;&amp; nextSibling.innerHTML;

                                if (p.innerHTML.includes(textToReplace) &amp;&amp; i % 2 == 0) {

                                    if ((nextSiblingText &amp;&amp; nextSiblingText.includes(nextText)) || i == selectedContent.children.length - 1) {

                                        let newText = p.textContent;

                                        const lastIdx = newText.lastIndexOf(textToReplace);

                                        newText = newText.substring(0, lastIdx) + `<span class='highlight'>${textToReplace}</span>` + newText.substring(lastIdx + textToReplace.length);

                                        p.innerHTML = newText;

                                        if (nextText) {

                                            newText = nextSibling.textContent.replace(nextText, `<span class='highlight'>${nextText}</span>`);

                                            nextSibling.innerHTML = newText;

                                        }

                                        continue;

                                    }

                                }

                            }

                        }

                        i++;

                    }

                } else {

                    selectedContent = selectedRange.extractContents();

                    const span = document.createElement('span');

                    span.className = 'highlight';

                    span.appendChild(selectedContent);

                    selectedRange.insertNode(span);

                }

            }

            closeContextMenu();

            window.getSelection().removeAllRanges();

        };

        window.addNote = () => {

            const note = prompt('Enter your note:');

            if (!note || !selectedRange || selectedRange.collapsed) {

                closeContextMenu();

                window.getSelection().removeAllRanges();

                return;

            }

            const selectedContent = selectedRange.cloneContents();

            if (selectedContent.querySelector('p') !== null) {

                const tooltipHTML = `<span class=&quot;comment-tooltip&quot;>${note}</span>`;

                let tooltipInjected = false;

                let i = 0;

                for (const child of selectedContent.children) {

                    if (i < selectedContent.children.length) {

                        const textToReplace = child.innerHTML;

                        const nextText = selectedContent.children[i + 1]?.innerHTML;

                        const allParagraphs = document.getElementsByTagName('p');

                        for (const p of allParagraphs) {

                            const nextSibling = p.nextElementSibling;

                            const nextSiblingText = nextSibling &amp;&amp; nextSibling.innerHTML;

                            if (p.innerHTML.includes(textToReplace) &amp;&amp; i % 2 == 0) {

                                if ((nextSiblingText &amp;&amp; nextSiblingText.includes(nextText)) || i == selectedContent.children.length - 1) {

                                    let newText = p.textContent;

                                    const lastIdx = newText.lastIndexOf(textToReplace);

                                    let spanEnd = tooltipInjected ? `</span>` : `${tooltipHTML}</span>`;

                                    tooltipInjected = true;

                                    newText = newText.substring(0, lastIdx) + `<span class='comment-highlight'>` + textToReplace + spanEnd + newText.substring(lastIdx + textToReplace.length);

                                    p.innerHTML = newText;

                                    if (nextText) {

                                        newText = nextSibling.textContent.replace(nextText, `<span class='comment-highlight'>${nextText}</span>`);

                                        nextSibling.innerHTML = newText;

                                    }

                                    continue;

                                }

                            }

                        }

                    }

                    i++;

                }

            } else {

                const span = document.createElement('span');

                span.className = 'comment-highlight';

                const tooltip = document.createElement('span');

                tooltip.className = 'comment-tooltip';

                tooltip.textContent = note;

                span.appendChild(selectedRange.extractContents());

                span.appendChild(tooltip);

                selectedRange.insertNode(span);

            }

            closeContextMenu();

            window.getSelection().removeAllRanges();

        };

        window.clearHighlight = () => {

            const el = contextMenu.targetElementForClear;

            if (el) unwrapElement(el);

            closeContextMenu();

            window.getSelection().removeAllRanges();

        };

        window.clearAllHighlights = () => {

            document.querySelectorAll('.highlight, .comment-highlight').forEach(unwrapElement);

            closeContextMenu();

            window.getSelection().removeAllRanges();

        };

        // RESIZER

        function initResize(e) {

            e.preventDefault();

            const startX = e.clientX;

            const startWidth = passagePanel.offsetWidth;

            const doDrag = (e) => {

                const nw = startWidth + e.clientX - startX;

                if (nw > 200 &amp;&amp; (document.body.clientWidth - nw - resizer.offsetWidth) > 200) {

                    passagePanel.style.flex = `0 0 ${nw}px`;

                }

            };

            const stopDrag = () => {

                window.removeEventListener('mousemove', doDrag);

                window.removeEventListener('mouseup', stopDrag);

            };

            window.addEventListener('mousemove', doDrag);

            window.addEventListener('mouseup', stopDrag);

        }

        // GOTO WIDGET

        document.getElementById('goto-btn').addEventListener('click', () => {

            const val = parseInt(document.getElementById('goto-input').value);

            if (val >= 1 &amp;&amp; val <= 40) goToQuestion(val);

        });

        document.getElementById('goto-input').addEventListener('keydown', (e) => {

            if (e.key === 'Enter') document.getElementById('goto-btn').click();

        });

        // EXPOSE GLOBALS

        window.nextQuestion = nextQuestion;

        window.previousQuestion = previousQuestion;

        window.goToQuestion = goToQuestion;

        window.switchToPart = switchToPart;

        window.closeResultsModal = closeResultsModal;

        // INIT

        function initialize() {

            buildSubQuestions();

            // Timer starts only when parent signals activation
            switchToPart(1);

            resizer.addEventListener('mousedown', initResize);

            initializeContextMenu();

            document.body.addEventListener('input', updateAllIndicators);

            document.body.addEventListener('change', updateAllIndicators);

            deliverButton.addEventListener('click', () => {
                // Collect answers BEFORE checkAnswers() disables the inputs
                var _rAnswers = [];
                for (var _i = 1; _i <= 40; _i++) {
                    var _sel = 'input[type=text]#q' + _i;
                    var _textEl = document.querySelector(_sel);
                    var _selEl = document.querySelector('select#q' + _i);
                    var _radioEl = document.querySelector('input[name=q' + _i + ']:checked');
                    var _val = '';
                    if (_textEl) _val = _textEl.value.trim();
                    else if (_selEl) _val = _selEl.value;
                    else if (_radioEl) _val = _radioEl.value;
                    _rAnswers.push('Q' + _i + ': ' + (_val || '(blank)'));
                }
                checkAnswers();
                // score is written to #results-score by checkAnswers()
                var _rScore = parseInt((document.getElementById('results-score') || {}).textContent) || 0;
                try {
                    window.parent.postMessage({
                        type: 'sectionData',
                        section: 'reading',
                        answers: _rAnswers.join(' | '),
                        score: _rScore
                    }, '*');
                } catch(e2){}
                try { window.parent.postMessage({type:'sectionDone', from:'reading'}, '*'); } catch(e){}
            });

            timerToggleButton.addEventListener('click', toggleTimer);

            timerResetButton.addEventListener('click', resetTimer);

            document.querySelectorAll('[data-q-start]').forEach(el => {

                el.addEventListener('click', () => {

                    const q = parseInt(el.dataset.qStart);

                    if (currentQuestion !== q) goToQuestion(q);

                });

            });

        }

        initialize();

    });

    </script>

    <script>
    (function() {
        let timeInSeconds = 2400; // 40 minutes
        let timerInterval;
        let isRunning = false;
        let submitted = false;

        const timerDisplay = document.getElementById('timer-display');
        const toggleBtn = document.getElementById('timer-toggle-btn');
        const resetBtn = document.getElementById('timer-reset-btn');
        const textarea = document.getElementById('response-area');
        const wordCountEl = document.getElementById('word-count');

        const pauseIcon = `<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; height=&quot;24px&quot; viewBox=&quot;0 0 24 24&quot; width=&quot;24px&quot;><path d=&quot;M0 0h24v24H0V0z&quot; fill=&quot;none&quot;/><path d=&quot;M6 19h4V5H6v14zm8-14v14h4V5h-4z&quot;/></svg>`;
        const playIcon = `<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; height=&quot;24px&quot; viewBox=&quot;0 0 24 24&quot; width=&quot;24px&quot;><path d=&quot;M0 0h24v24H0V0z&quot; fill=&quot;none&quot;/><path d=&quot;M8 5v14l11-7z&quot;/></svg>`;

        function updateTimerDisplay() {
            const m = Math.floor(timeInSeconds / 60);
            const s = timeInSeconds % 60;
            timerDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            if (timeInSeconds <= 300) timerDisplay.classList.add('warning');
            else timerDisplay.classList.remove('warning');
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            isRunning = true;
            toggleBtn.innerHTML = pauseIcon;
            timerInterval = setInterval(() => {
                if (submitted) { clearInterval(timerInterval); return; }
                timeInSeconds--;
                updateTimerDisplay();
                if (timeInSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.textContent = &quot;Time's up!&quot;;
                    document.getElementById('timesup-modal').classList.remove('hidden');
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            toggleBtn.innerHTML = playIcon;
        }

        toggleBtn.addEventListener('click', () => {
            if (isRunning) pauseTimer(); else startTimer();
        });

        resetBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            timeInSeconds = 2400;
            isRunning = false;
            toggleBtn.innerHTML = playIcon;
            updateTimerDisplay();
            timerDisplay.classList.remove('warning');
        });

        // Word count
        textarea.addEventListener('input', () => {
            const words = textarea.value.trim() === '' ? 0 : textarea.value.trim().split(/\s+/).length;
            wordCountEl.textContent = `${words} word${words !== 1 ? 's' : ''}`;
            wordCountEl.className = 'word-count' + (words >= 250 ? ' met' : '');
        });

        // Task selection highlight
        document.querySelectorAll('input[name=&quot;task-choice&quot;]').forEach(radio => {
            radio.addEventListener('change', () => {
                document.querySelectorAll('.task-option').forEach(el => el.classList.remove('selected'));
                radio.closest('.task-option').classList.add('selected');
            });
        });

        // Submit
        document.getElementById('deliver-button').addEventListener('click', () => {
            const words = textarea.value.trim() === '' ? 0 : textarea.value.trim().split(/\s+/).length;
            const taskChosen = document.querySelector('input[name=&quot;task-choice&quot;]:checked');
            let msg = 'Are you sure you want to submit your response?';
            if (!taskChosen) msg = 'You have not selected a task. Are you sure you want to submit?';
            else if (words < 250) msg = `Your response is ${words} words, which is below the 250-word minimum. Are you sure you want to submit?`;
            document.getElementById('modal-message').textContent = msg;
            document.getElementById('submit-modal').classList.remove('hidden');
        });

        document.getElementById('modal-cancel').addEventListener('click', () => {
            document.getElementById('submit-modal').classList.add('hidden');
        });
        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('submit-modal').classList.add('hidden');
        });
        document.getElementById('modal-confirm').addEventListener('click', () => {
            submitted = true;
            clearInterval(timerInterval);
            document.getElementById('submit-modal').classList.add('hidden');
            pauseTimer();
            textarea.disabled = true;
            document.getElementById('deliver-button').disabled = true;
            timerDisplay.textContent = 'Submitted';
            timerDisplay.classList.remove('warning');
            // Show next section button
            document.getElementById('next-section-writing').style.display = 'flex';
            // Send writing response to parent for Google Form submission
            try {
                window.parent.postMessage({
                    type: 'sectionData',
                    section: 'writing',
                    answers: textarea.value.trim(),
                    score: ''
                }, '*');
            } catch(e2){}
            try { window.parent.postMessage({type:'sectionDone', from:'writing'}, '*'); } catch(e){}
        });

        document.getElementById('timesup-ok').addEventListener('click', () => {
            document.getElementById('timesup-modal').classList.add('hidden');
        });

        // Timer starts on parent activation message
        window.addEventListener('message', function(e) {
            if (e.data &amp;&amp; e.data.type === 'activateTest' &amp;&amp; e.data.test === 'writing') {
                if (!isRunning &amp;&amp; !submitted) startTimer();
            }
        });
    })();
    </script>
</body>

            <div id=&quot;drive-link-error&quot; style=&quot;color:#e74c3c;font-size:12px;min-height:18px;margin-bottom:14px;display:none;&quot;>Please paste a valid Google Drive link.</div>

            <div style=&quot;background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:13px;color:#856404;display:flex;align-items:flex-start;gap:8px;&quot;>
                <span style=&quot;font-size:16px;line-height:1.3;&quot;>⚠️</span>
