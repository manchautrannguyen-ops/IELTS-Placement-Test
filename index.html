    <!-- Time's Up Modal -->
    <div class=&quot;modal-overlay hidden&quot; id=&quot;timesup-modal&quot;>
        <div class=&quot;modal-content&quot;>
            <h2>⏰ Time's Up!</h2>
            <p>Your 15 minutes have ended. The speaking test is now complete.</p>
            <div class=&quot;modal-actions&quot;>
                <button class=&quot;primary&quot; id=&quot;timesup-ok&quot;>OK</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        let timeInSeconds = 900; // 15 minutes
        let timerInterval;
        let isRunning = false;
        let finished = false;

        const timerDisplay = document.getElementById('timer-display');
        const toggleBtn = document.getElementById('timer-toggle-btn');
        const resetBtn = document.getElementById('timer-reset-btn');

        const pauseIcon = `<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; height=&quot;24px&quot; viewBox=&quot;0 0 24 24&quot; width=&quot;24px&quot;><path d=&quot;M0 0h24v24H0V0z&quot; fill=&quot;none&quot;/><path d=&quot;M6 19h4V5H6v14zm8-14v14h4V5h-4z&quot;/></svg>`;
        const playIcon = `<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; height=&quot;24px&quot; viewBox=&quot;0 0 24 24&quot; width=&quot;24px&quot;><path d=&quot;M0 0h24v24H0V0z&quot; fill=&quot;none&quot;/><path d=&quot;M8 5v14l11-7z&quot;/></svg>`;

        function updateTimerDisplay() {
            const m = Math.floor(timeInSeconds / 60);
            const s = timeInSeconds % 60;
            timerDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            if (timeInSeconds <= 120) timerDisplay.classList.add('warning');
            else timerDisplay.classList.remove('warning');
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            isRunning = true;
            toggleBtn.innerHTML = pauseIcon;
            timerInterval = setInterval(() => {
                if (finished) { clearInterval(timerInterval); return; }
                timeInSeconds--;
                updateTimerDisplay();
                if (timeInSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.textContent = &quot;Time's up!&quot;;
                    document.getElementById('timesup-modal').classList.remove('hidden');
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            toggleBtn.innerHTML = playIcon;
        }

        toggleBtn.addEventListener('click', () => {
            if (isRunning) pauseTimer(); else startTimer();
        });

        resetBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            timeInSeconds = 900;
            isRunning = false;
            toggleBtn.innerHTML = playIcon;
            updateTimerDisplay();
            timerDisplay.classList.remove('warning');
        });

        document.getElementById('deliver-button').addEventListener('click', () => {
            document.getElementById('submit-modal').classList.remove('hidden');
        });

        document.getElementById('modal-cancel').addEventListener('click', () => {
            document.getElementById('submit-modal').classList.add('hidden');
        });
        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('submit-modal').classList.add('hidden');
        });
        document.getElementById('modal-confirm').addEventListener('click', () => {
            const link = document.getElementById('drive-link-input').value.trim();
            const errEl = document.getElementById('drive-link-error');
            if (!link || !link.includes('drive.google.com')) {
                errEl.style.display = 'block';
                errEl.textContent = 'Please paste a valid Google Drive link.';
                document.getElementById('drive-link-input').style.borderColor = '#e74c3c';
                return;
            }
            finished = true;
            clearInterval(timerInterval);
            document.getElementById('submit-modal').classList.add('hidden');
            timerDisplay.textContent = 'Submitted';
            timerDisplay.classList.remove('warning');
            document.getElementById('deliver-button').disabled = true;
            // Show confirmation
            showDriveConfirmation(link);
            // Send speaking Drive link to parent for Google Form submission
            try {
                window.parent.postMessage({
                    type: 'sectionData',
                    section: 'speaking',
                    answers: link,
                    score: ''
                }, '*');
            } catch(e2){}
            try { window.parent.postMessage({type:'sectionDone', from:'speaking'}, '*'); } catch(e){}
        });

        document.getElementById('drive-link-input').addEventListener('input', () => {
            document.getElementById('drive-link-error').style.display = 'none';
            document.getElementById('drive-link-input').style.borderColor = '#ccc';
        });

        document.getElementById('timesup-ok').addEventListener('click', () => {
            document.getElementById('timesup-modal').classList.add('hidden');
        });

        function showDriveConfirmation(link) {
            const content = document.querySelector('.content-area');
            const banner = document.createElement('div');
            banner.style.cssText = 'background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border:1px solid #a5d6a7;border-radius:12px;padding:24px 28px;margin-top:30px;text-align:center;';
            banner.innerHTML = `
                <div style=&quot;font-size:40px;margin-bottom:12px;&quot;>✅</div>
                <div style=&quot;font-size:18px;font-weight:700;color:#2e7d32;margin-bottom:8px;&quot;>Speaking Submitted!</div>
                <div style=&quot;font-size:14px;color:#555;margin-bottom:14px;&quot;>Your recording link has been recorded.</div>
                <div style=&quot;background:#fff;border:1px solid #c8e6c9;border-radius:8px;padding:10px 14px;font-size:13px;word-break:break-all;color:#1a73e8;text-align:left;&quot;>
                    <strong style=&quot;color:#333;display:block;margin-bottom:4px;&quot;>Submitted link:</strong>
                    <a href=&quot;${link}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; style=&quot;color:#1a73e8;&quot;>${link}</a>
                </div>
                <div style=&quot;font-size:13px;color:#777;margin-top:12px;&quot;>You have completed all sections of the IELTS Practice Test. Well done!</div>
            `;
            content.appendChild(banner);
            banner.scrollIntoView({behavior:'smooth', block:'center'});
        }

        // Timer starts on parent activation message
        window.addEventListener('message', function(e) {
            if (e.data &amp;&amp; e.data.type === 'activateTest' &amp;&amp; e.data.test === 'speaking') {
                if (!isRunning &amp;&amp; !finished) startTimer();
            }
        });
    })();
    </script>

<div class="transition-overlay" id="t-overlay">
    <div class="t-spinner"></div>
    <div class="t-label" id="t-label">Loading next section...</div>
</div>

<script>
    const ORDER = ['listening','reading','writing','speaking'];
    const LABELS = {listening:'Listening',reading:'Reading',writing:'Writing',speaking:'Speaking'};
    const timerStarted = {listening:false,reading:false,writing:false,speaking:false};

    // ── Google Form configuration ──────────────────────────────────────────
    const FORM_ID   = '1FAIpQLSeveSpmqTifkAOPOrZuqHvE2bxgjg8tp05i0I1vCRqBWHBCCw';
    const FORM_BASE = `https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`;
    const FIELDS = {
        fullName         : 'entry.1078133213',
        listeningAnswers : 'entry.377437222',
        listeningScore   : 'entry.2068544339',
        readingAnswers   : 'entry.322466094',
        readingScore     : 'entry.1195061213',
        writingAnswer    : 'entry.2118610765',
        speakingAnswer   : 'entry.1030048054'
    };

    // Collected section data
    const collected = {
        fullName: '',
        listeningAnswers: '', listeningScore: '',
        readingAnswers: '', readingScore: '',
        writingAnswer: '',
        speakingAnswer: ''
    };

    // ── Registration ───────────────────────────────────────────────────────
    document.getElementById('reg-btn').addEventListener('click', register);
    document.getElementById('reg-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') register();
        document.getElementById('reg-input').classList.remove('error');
        document.getElementById('reg-error').classList.remove('show');
    });
    function register() {
        const name = document.getElementById('reg-input').value.trim();
        if (!name) {
            document.getElementById('reg-input').classList.add('error');
            document.getElementById('reg-error').classList.add('show');
            document.getElementById('reg-input').focus();
            return;
        }
        collected.fullName = name;
        document.getElementById('display-name').textContent = name;
        document.getElementById('reg-page').classList.add('hidden');
        document.getElementById('app-shell').classList.add('visible');
    }

    // ── Tab switching ──────────────────────────────────────────────────────
    function switchTest(name, tabEl) {
        const btn = tabEl || document.querySelector(`[data-test="${name}"]`);
        if (!btn.classList.contains('unlocked')) return;
        document.querySelectorAll('.test-frame').forEach(f => f.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        document.getElementById('frame-' + name).classList.add('active');
        btn.classList.add('active');
        if (!timerStarted[name]) {
            timerStarted[name] = true;
            setTimeout(() => {
                const frame = document.getElementById('frame-' + name);
                frame.contentWindow.postMessage({type:'activateTest', test:name}, '*');
            }, 400);
        }
    }

    // ── Messages from iframes ──────────────────────────────────────────────
    window.addEventListener("message", function(e) {
        if (!e.data || !e.data.type) return;

        // Collect section results for Google Form
        if (e.data.type === 'sectionData') {
            const sec = e.data.section;
            if (sec === 'listening') {
                collected.listeningAnswers = e.data.answers || '';
                collected.listeningScore   = String(e.data.score !== undefined ? e.data.score : '');
            } else if (sec === 'reading') {
                collected.readingAnswers = e.data.answers || '';
                collected.readingScore   = String(e.data.score !== undefined ? e.data.score : '');
            } else if (sec === 'writing') {
                collected.writingAnswer = e.data.answers || '';
            } else if (sec === 'speaking') {
                collected.speakingAnswer = e.data.answers || '';
                // Speaking is the last section — submit to Google Form now
                submitToGoogleForm();
            }
        }

        if (e.data.type === 'testStarted') timerStarted[e.data.test] = true;
        if (e.data.type === 'sectionDone') {
            const btn = document.querySelector(`[data-test="${e.data.from}"]`);
            if (btn) btn.classList.add('done');
            const idx = ORDER.indexOf(e.data.from);
            if (idx >= 0 && idx < ORDER.length - 1) unlockTest(ORDER[idx + 1]);
        }
        if (e.data.type === 'nextSection') goToNext(e.data.from);
    });

    // ── Google Form submission ─────────────────────────────────────────────
    function submitToGoogleForm() {
        const params = new URLSearchParams();
        params.append(FIELDS.fullName,         collected.fullName);
        params.append(FIELDS.listeningAnswers, collected.listeningAnswers);
        params.append(FIELDS.listeningScore,   collected.listeningScore);
        params.append(FIELDS.readingAnswers,   collected.readingAnswers);
        params.append(FIELDS.readingScore,     collected.readingScore);
        params.append(FIELDS.writingAnswer,    collected.writingAnswer);
        params.append(FIELDS.speakingAnswer,   collected.speakingAnswer);

        // Submit via a hidden iframe (no CORS issues with Google Forms)
        const iframe = document.createElement('iframe');
        iframe.name   = '_gform_submit_target';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = FORM_BASE;
        form.target = '_gform_submit_target';
        form.style.display = 'none';
        params.forEach((val, key) => {
            const input = document.createElement('input');
            input.type  = 'hidden';
            input.name  = key;
            input.value = val;
            form.appendChild(input);
        });
        document.body.appendChild(form);
        form.submit();

        // Cleanup after short delay
        setTimeout(() => {
            try { document.body.removeChild(iframe); } catch(e) {}
            try { document.body.removeChild(form); }  catch(e) {}
        }, 5000);
    }

    // ── Helpers ────────────────────────────────────────────────────────────
    function unlockTest(name) {
        const btn = document.querySelector(`[data-test="${name}"]`);
        if (btn) btn.classList.add('unlocked');
    }

    function goToNext(from) {
        const idx = ORDER.indexOf(from);
        if (idx < 0 || idx >= ORDER.length - 1) return;
        const next = ORDER[idx + 1];
        unlockTest(next);
        document.getElementById('t-label').textContent = 'Starting ' + LABELS[next] + ' section...';
        document.getElementById('t-overlay').classList.add('show');
        setTimeout(() => {
            document.getElementById('t-overlay').classList.remove('show');
            switchTest(next);
        }, 900);
    }
</script>
